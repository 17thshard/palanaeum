# Copy this file to deploy/k3s/secret.yaml (gitignored), fill in real values,
# and apply it before deploying the rest of the manifests:
#   kubectl apply -f deploy/k3s/namespace.yaml
#   kubectl apply -f deploy/k3s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: palanaeum-secrets
  namespace: palanaeum
type: Opaque
stringData:
  # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(50))"
  PALA_SECRET_KEY: "replace-with-a-long-random-secret-key"
  # Used by both PostgreSQL and Django (PALA_DB_PASSWORD)
  POSTGRES_PASSWORD: "replace-with-a-strong-database-password"
  # Optional SMTP password when PALA_EMAIL_HOST is configured
  PALA_EMAIL_PASSWORD: ""
