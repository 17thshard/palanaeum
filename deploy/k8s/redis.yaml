# redis-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        # Use the official Redis image from Docker Hub
        image: redis:8
        ports:
        - containerPort: 6379 # Default Redis port
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  # This makes the service only reachable from within the cluster.
  # It's the default type, but we specify it for clarity.
  type: ClusterIP
  selector:
    # This selector ensures the service routes traffic to pods
    # with the 'app: redis' label.
    app: redis
  ports:
    - protocol: TCP
      # The port the service will expose.
      port: 6379
      # The port on the pod that the service will forward traffic to.
      targetPort: 6379

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service-np
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
      nodePort: 30001