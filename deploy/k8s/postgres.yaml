apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  # ReadWriteOnce means the volume can be mounted as read-write by a single Node.
  # This is suitable for a single-instance database.
  accessModes:
    - ReadWriteOnce
  # Your cluster needs a StorageClass to dynamically provision the volume.
  # Most managed Kubernetes services have a default one.
  resources:
    requests:
      storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17
        ports:
        - containerPort: 5432 # Default PostgreSQL port
        envFrom:
          # Load database credentials from the Secret
          - secretRef:
              name: postgres-secret
        volumeMounts:
          # Mount the persistent volume to the data directory
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: "1.5"
            memory: "1Gi"
          requests:
            cpu: "0.75"
            memory: "512Mi"
      volumes:
        # Define the volume that will be used by the container
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP
  selector:
    # Route traffic to pods with the 'app: postgres' label
    app: postgres
  ports:
    - protocol: TCP
      # The port the service will expose
      port: 5432
      # The port on the pod to forward traffic to
      targetPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-service-np
spec:
  type: NodePort
  selector:
    # Route traffic to pods with the 'app: postgres' label
    app: postgres
  ports:
    - protocol: TCP
      # The port the service will expose
      port: 5432
      # The port on the pod to forward traffic to
      targetPort: 5432
      nodePort: 30000